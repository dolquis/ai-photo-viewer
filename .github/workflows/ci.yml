name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AiPhotoViewer.sln

      - name: Build
        run: dotnet build AiPhotoViewer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AiPhotoViewer.sln --configuration Release --no-build --verbosity normal

  format:
    name: format check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify formatting
        run: dotnet format AiPhotoViewer.sln --verify-no-changes
