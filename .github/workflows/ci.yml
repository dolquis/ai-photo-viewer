name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR / ブランチの旧 run を打ち切る。main への push は打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AiPhotoViewer.sln

      - name: Build
        run: dotnet build AiPhotoViewer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AiPhotoViewer.sln --configuration Release --no-build --verbosity normal

      # 旧 format ジョブの統合。step レベルの continue-on-error なので、
      # フォーマット差分があってもジョブ（チェック）は緑のまま informational に
      # 留まる（job レベルだとチェックが赤く表示される）。checkout + .NET
      # セットアップの重複と 2 本目のランナー起動をなくす。
      - name: Verify formatting (informational)
        continue-on-error: true
        run: dotnet format AiPhotoViewer.sln --verify-no-changes

      # docs-lint（dolquis/agent-ops origin のベンダリングコピー）。既存の findings は
      # .docs-lint-baseline.json で凍結し、増加だけを止める。
      - name: docs-lint (baseline ratchet)
        run: python3 scripts/docs-lint.py --baseline .docs-lint-baseline.json
